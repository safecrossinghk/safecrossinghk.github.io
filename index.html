<!DOCTYPE html>
<html lang="zh-Hant">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#f0f8ff">

<title>🌧️ 香港降雨預報</title>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

<!-- PWA -->
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="香港降雨預報">

<!-- OneSignal Web SDK v16 -->
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

<!-- CounterAPI Browser SDK -->
<script src="https://cdn.jsdelivr.net/npm/counterapi/dist/counter.browser.min.js" defer></script>

<style>
body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
margin: 0;
padding: 0;
background: #f0f8ff;
color: #333;
text-align: center;
}

h1 {
font-size: 1.4em;
margin: 1em 0 0.5em;
}

/* 確保 #map 有明確高度及 display */
#map {
height: 300px;
width: calc(100% - 20px);
margin: 0 10px;
border-radius: 8px;
border: 1px solid #ccc;
position: relative;
box-sizing: border-box;
display: block;
}

#ai-forecast {
margin: 1em;
padding: 1em;
border: 2px solid #0077cc;
border-radius: 8px;
background: #fff;
text-align: left;
}

#rain-alert {
margin: 1em;
font-size: 1.2em;
font-weight: bold;
line-height: 1.8em;
white-space: pre-line;
}

#footer-text {
margin: 1.5em;
font-size: 0.9em;
color: #555;
line-height: 1.6em;
}

.promptBox {
position: fixed;
bottom: 20px;
left: 10%;
right: 10%;
background: #fff3cd;
color: #333;
border: 1px solid #ffeeba;
padding: 15px;
border-radius: 10px;
font-size: 0.95em;
box-shadow: 0 2px 6px rgba(0,0,0,0.2);
z-index: 9999;
}

.promptBox button {
margin-top: 10px;
padding: 6px 12px;
background: #0077cc;
color: white;
border: none;
border-radius: 5px;
}

.map-weather-pill {
background: rgba(255,255,255,0.95);
border: 1px solid rgba(0,0,0,0.15);
border-radius: 30px;
padding: 5px 12px;
box-shadow: 0 2px 8px rgba(0,0,0,0.15);
display: flex;
align-items: center;
gap: 6px;
pointer-events: auto;
margin-top: 10px !important;
margin-right: 10px !important;
}

.pill-temp {
font-size: 15px;
font-weight: bold;
color: #111;
}

.pill-logo {
display: inline-flex;
align-items: center;
justify-content: center;
font-size: 16px;
min-width: 22px;
height: 22px;
}

.pill-logo img {
width: 22px;
height: 22px;
object-fit: contain;
}

#reload-container {
margin: 1.5em 0 0.8em;
text-align: center;
}

#reloadBtn {
padding: 10px 24px;
font-size: 1em;
font-weight: 600;
color: #fff;
background: #0077cc;
border: none;
border-radius: 8px;
cursor: pointer;
box-shadow: 0 2px 5px rgba(0,0,0,0.15);
}

#reloadBtn:active {
transform: scale(0.97);
}

#debugBox {
display: block !important;
}
</style>

<script>
window.OneSignalDeferred = window.OneSignalDeferred || [];
window.oneSignalReady = false;

window.oneSignalInitPromise = new Promise((resolve) => {
window.OneSignalDeferred.push(async function(OneSignal) {
try {
console.log("========== OneSignal 初始化開始 ==========");
await OneSignal.init({
appId: "880241cd-cc45-4820-b5ec-a1236b0e3e98",
safari_web_id: "web.onesignal.auto.613528e9-2930-4b07-a098-5a9518822d98",
notifyButton: { enable: false }
});
window.oneSignalReady = true;
console.log("========== OneSignal 初始化完成 ==========");
resolve(OneSignal);
} catch (error) {
console.error("OneSignal 初始化失敗:", error);
resolve(null);
}
});
});
</script>
</head>

<body>

<h1>🌂 香港降雨預報</h1>

<!-- 地圖 -->
<div id="map"></div>

<!-- AI 預測 -->
<div id="ai-forecast">
<strong>🧠 AI 超前預測</strong>
<div id="rainMsg">正在載入...</div>
</div>

<!-- 即時雨勢 -->
<div id="rain-alert">正在讀取預報資料...</div>

<!-- OneSignal 訂閱提示 -->
<div id="customPrompt" class="promptBox" style="display:none;">
📢 歡迎使用《香港降雨預報》<br>
👉 你可以訂閱通知，即時收到降雨提示。<br>
<button id="subscribeBtn">訂閱通知</button>
<button id="closeCustomBtn">稍後再說</button>
</div>

<!-- iOS Safari / PWA 提示 -->
<div id="iosPrompt" class="promptBox" style="display:none;">
📱 如果你使用 iPhone / iPad：<br>
請先按 Safari 底部的 <b>分享</b> 按鈕<br>
➜ 再選擇 <b>加入主畫面</b><br>
加入主畫面後才可以使用 PWA 推播通知。<br>
<button id="iosCloseBtn">知道了</button>
</div>

<!-- Footer -->
<div id="footer-text">
<p style="text-align:left; margin-bottom:1.5em;">
《香港降雨預報》提供香港地區未來最多六小時的定點降雨預測...
</p>
</div>

<!-- 重新載入 -->
<div id="reload-container">
<button id="reloadBtn" type="button">🔄 重新載入</button>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const workerUrl = "https://crowdtest8r.ctakwah.workers.dev/";
let map = null;
let marker = null;
let rainStatus = 0;

/* Debug 輔助 */
function debug(text) {
let box = document.getElementById("debugBox");
if (!box) {
box = document.createElement("div");
box.id = "debugBox";
box.style.cssText = "position:fixed;top:0;left:0;right:0;max-height:200px;overflow:auto;background:#000;color:#0f0;font-size:11px;z-index:99999;padding:6px;white-space:pre-wrap;text-align:left;";
document.body.appendChild(box);
}
box.innerHTML += "<br>" + text;
}

window.onerror = function(msg, url, line, col, error) {
debug("ERROR: " + msg + " (Line: " + line + ")");
return false;
};

/* Leaflet Weather Control */
const WeatherControl = L.Control.extend({
options: { position: "topright" },
onAdd: function(map) {
const div = L.DomUtil.create("div", "map-weather-pill");
div.innerHTML = `<span class="pill-temp" id="pill-temp">--°</span><span class="pill-logo" id="pill-logo"></span>`;
L.DomEvent.disableClickPropagation(div);
return div;
}
});

/* 初始化地圖 (增加 invalidateSize 確保渲染) */
function initMap() {
if (map !== null) return;

map = L.map("map").setView([22.3, 114.2], 11);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
attribution: "&copy; OpenStreetMap contributors"
}).addTo(map);

map.addControl(new WeatherControl());

// 強制重新計算 Leaflet 地圖容器尺寸
setTimeout(() => {
map.invalidateSize();
}, 200);
}

function setMarker(lat, lon) {
if (marker) map.removeLayer(marker);
marker = L.marker([lat, lon]).addTo(map);
}

function getWeatherIconByCode(code) {
const iconMap = {
0: "☀️", 1000: "☀️", 1100: "🌤️", 1101: "⛅", 1102: "🌥️",
1001: "☁️", 2000: "🌫️", 2100: "🌫️", 4000: "🌧️", 4001: "🌧️",
4200: "🌧️", 4201: "🌧️", 5000: "🌨️", 8000: "⛈️"
};
return iconMap[code] || "🌤️";
}

function updateWeatherPill(data) {
const pillTempEl = document.getElementById("pill-temp");
const logoContainer = document.getElementById("pill-logo");

if (data?.tomorrow?.temperature !== undefined) {
pillTempEl.innerText = `${Math.round(data.tomorrow.temperature)}°`;
}

if (data?.hko?.weatherIcon) {
const imgUrl = `https://www.hko.gov.hk/images/wxicon/pic${data.hko.weatherIcon}.png`;
const img = new Image();
img.src = imgUrl;
img.onload = () => logoContainer.innerHTML = `<img src="${imgUrl}" alt="HKO Icon">`;
img.onerror = () => {
if (data?.tomorrow?.weatherCode) {
logoContainer.innerText = getWeatherIconByCode(data.tomorrow.weatherCode);
}
};
} else if (data?.tomorrow?.weatherCode) {
logoContainer.innerText = getWeatherIconByCode(data.tomorrow.weatherCode);
}
}

/* 讀取 Worker 資料 */
async function fetchForecast(lat, lon) {
try {
debug("開始向 Worker 查詢資料...");
const fetchUrl = `${workerUrl}?lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}`;

const response = await fetch(fetchUrl, { method: "GET" });
if (!response.ok) throw new Error("Worker HTTP " + response.status);

const data = await response.json();
debug("Worker 已成功回傳資料");

updateWeatherPill(data);

const alertDiv = document.getElementById("rain-alert");
const rainMsg = document.getElementById("rainMsg");

if (data && data.hko) {
const isRaining = Number(data.hko.immediateRain) >= 0.5;
if (isRaining) {
alertDiv.innerText = "⚠️ 你所在的位置有雨";
rainMsg.innerText = "未有AI預報資料";
if (rainStatus === 0) speak("你所在的位置有雨");
rainStatus = 1;
} else {
alertDiv.innerText = "☁️ 你所在的位置暫時無雨";
rainStatus = 0;
if (data.tomorrow) {
rainMsg.innerText = data.tomorrow.rainExpected
? (data.tomorrow.message || "約六小時內可能有雨")
: "未來六小時暫時無明顯降雨";
} else {
rainMsg.innerText = "⚠️ 暫無 Tomorrow.io 預報";
}
}
} else {
alertDiv.innerText = "⚠️ 數據格式不匹配";
rainMsg.innerText = "⚠️ 數據格式不匹配";
}
} catch (err) {
console.error("Worker 預報錯誤:", err);
debug("Worker 查詢失敗: " + err.message);
document.getElementById("rain-alert").innerText = "⚠️ 資料讀取失敗，請檢查網路網絡";
document.getElementById("rainMsg").innerText = "⚠️ 無法取得 AI 預測數據";
}
}

function speak(text) {
try {
const msg = new SpeechSynthesisUtterance(text);
msg.lang = "zh-HK";
speechSynthesis.speak(msg);
} catch (err) {
console.warn("語音失敗:", err);
}
}

async function registerLocation(playerId, lat, lon) {
try {
const res = await fetch(workerUrl + "registerLocation", {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({ playerId, lat, lon })
});
if (!res.ok) throw new Error("HTTP " + res.status);
debug("位置已登記到 Worker");
} catch (err) {
debug("registerLocation 失敗: " + err.message);
}
}

async function getOneSignalPlayerId() {
try {
const OneSignal = await window.oneSignalInitPromise;
if (!OneSignal) return null;

const playerId = OneSignal.User?.PushSubscription?.id;
const optedIn = OneSignal.User?.PushSubscription?.optedIn;

if (playerId && optedIn === true) return playerId;
return null;
} catch (err) {
return null;
}
}

async function initLocation() {
return new Promise((resolve) => {
const fallbackLat = 22.3;
const fallbackLon = 114.2;

if (!navigator.geolocation) {
alert("此瀏覽器不支援定位功能");
map.setView([fallbackLat, fallbackLon], 11);
setMarker(fallbackLat, fallbackLon);
fetchForecast(fallbackLat, fallbackLon);
resolve();
return;
}

navigator.geolocation.getCurrentPosition(
async function(pos) {
const lat = pos.coords.latitude;
const lon = pos.coords.longitude;
debug("定位成功: " + lat + ", " + lon);

map.setView([lat, lon], 13);
setMarker(lat, lon);
fetchForecast(lat, lon);

const playerId = await getOneSignalPlayerId();
if (playerId) await registerLocation(playerId, lat, lon);
resolve();
},
function(err) {
debug("定位失敗，使用預設位置");
map.setView([fallbackLat, fallbackLon], 11);
setMarker(fallbackLat, fallbackLon);
fetchForecast(fallbackLat, fallbackLon);
resolve();
},
{ enableHighAccuracy: true, timeout: 10000, maximumAge: 300000 }
);
});
}

function isIOSDevice() {
return /iPhone|iPad|iPod/i.test(navigator.userAgent);
}

function isStandalonePWA() {
return (window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches);
}

function showIosPromptOnce() {
if (!isIOSDevice() || isStandalonePWA() || localStorage.getItem("iosPromptShown")) return;
const prompt = document.getElementById("iosPrompt");
if (prompt) {
prompt.style.display = "block";
document.getElementById("iosCloseBtn").onclick = function() {
prompt.style.display = "none";
localStorage.setItem("iosPromptShown", "1");
};
}
}

async function checkSubscriptionState() {
try {
const OneSignal = await window.oneSignalInitPromise;
if (!OneSignal) return null;
return {
playerId: OneSignal.User?.PushSubscription?.id || null,
optedIn: OneSignal.User?.PushSubscription?.optedIn === true,
permission: OneSignal.Notifications?.permission
};
} catch (err) {
return null;
}
}

async function showCustomPrompt() {
const prompt = document.getElementById("customPrompt");
if (!prompt) return;

const subscriptionState = await checkSubscriptionState();
if (subscriptionState?.playerId && subscriptionState?.optedIn) {
prompt.style.display = "none";
return;
}

if (isIOSDevice() && !isStandalonePWA()) {
prompt.style.display = "none";
return;
}

prompt.style.display = "block";
document.getElementById("subscribeBtn").onclick = async function() {
const button = document.getElementById("subscribeBtn");
try {
button.disabled = true;
button.innerText = "正在訂閱...";
const OneSignal = await window.oneSignalInitPromise;
if (!OneSignal) throw new Error("OneSignal 尚未準備完成");

await OneSignal.Notifications.requestPermission();
if (OneSignal.Notifications.permission !== true) throw new Error("通知權限未獲得");

await OneSignal.User.PushSubscription.optIn();
prompt.style.display = "none";
} catch (err) {
alert("通知訂閱未完成，請確認已開啟權限。");
} finally {
button.disabled = false;
button.innerText = "訂閱通知";
}
};

document.getElementById("closeCustomBtn").onclick = function() {
prompt.style.display = "none";
};
}

/* 頁面加載主入口 */
window.addEventListener("DOMContentLoaded", function() {
debug("① DOMContentLoaded - 初始化地圖");
initMap();
});

window.addEventListener("load", async function() {
debug("② Page Loaded - 開始取得定位與預報");
await initLocation();

document.getElementById("reloadBtn")?.addEventListener("click", () => window.location.reload());
showIosPromptOnce();
setTimeout(showCustomPrompt, 1500);
});
</script>
</body>
</html>
