window.OneSignalDeferred =
window.OneSignalDeferred || [];


window.oneSignalReady = false;


window.oneSignalInitPromise =
new Promise((resolve) => {

window.OneSignalDeferred.push(
async function(OneSignal) {

try {

console.log(
"========== OneSignal 初始化開始 =========="
);


await OneSignal.init({

appId:
"880241cd-cc45-4820-b5ec-a1236b0e3e98",

safari_web_id:
"web.onesignal.auto.613528e9-2930-4b07-a098-5a9518822d98",

notifyButton: {

enable: false

}

});


window.oneSignalReady = true;


console.log(
"========== OneSignal 初始化完成 =========="
);


console.log(
"Notification Permission:",
OneSignal.Notifications.permission
);


resolve(
OneSignal
);


}
catch (error) {

console.error(
"❌ OneSignal 初始化失敗:",
error
);


resolve(null);

}

}
);

});

Leaflet
===================================================== -->

<script
src="https://unpkg.com/leaflet/dist/leaflet.js">
</script>


<script>

/* =====================================================
1. 基本設定
===================================================== */


/*
* V4.2 Cloudflare Worker
*
* 注意：
* HTML 不再直接呼叫 Tomorrow.io
*/

const workerUrl =
"https://crowdtest8r.ctakwah.workers.dev/";


let map = null;

let marker = null;


/*
* 0 = 暫時無雨
* 1 = 有雨
*/

let rainStatus = 0;


/* =====================================================
2. Debug
===================================================== */

function debug(text) {

let box =
document.getElementById(
"debugBox"
);


if (!box) {

box =
document.createElement(
"div"
);


box.id =
"debugBox";


box.style.cssText =
"position:fixed;" +
"top:0;" +
"left:0;" +
"right:0;" +
"max-height:260px;" +
"overflow:auto;" +
"background:#000;" +
"color:#0f0;" +
"font-size:12px;" +
"z-index:99999;" +
"padding:8px;" +
"white-space:pre-wrap;" +
"text-align:left;";


document.body.appendChild(
box
);

}


box.innerHTML +=
"<br>" +
text;

}


/* =====================================================
3. 全域 Error
===================================================== */

window.onerror =
function(
msg,
url,
line,
col,
error
) {

debug(
"❌ ERROR\n" +
msg +
"\nLine: " +
line +
"\nColumn: " +
col
);


return false;

};


/* =====================================================
4. Leaflet Weather Control
===================================================== */

const WeatherControl =
L.Control.extend({

options: {

position:
"topright"

},


onAdd:
function(map) {

const div =
L.DomUtil.create(
"div",
"map-weather-pill"
);


div.innerHTML = `

<span
class="pill-temp"
id="pill-temp">
--°
</span>

<span
class="pill-logo"
id="pill-logo">
⏳
</span>

`;


L.DomEvent
.disableClickPropagation(
div
);


return div;

}

});


/* =====================================================
5. 初始化地圖
===================================================== */

function initMap() {

map =
L.map("map")
.setView(
[22.3,114.2],
11
);


L.tileLayer(

"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

{

attribution:
"&copy; OpenStreetMap contributors"

}

).addTo(map);


map.addControl(
new WeatherControl()
);

}


/* =====================================================
6. Marker
===================================================== */

function setMarker(
lat,
lon
) {

if (marker) {

map.removeLayer(
marker
);

}


marker =
L.marker(
[lat,lon]
).addTo(map);

}


/* =====================================================
7. Tomorrow.io Weather Icon
===================================================== */

function getWeatherIconByCode(
code
) {

const iconMap = {

0: "☀️",

1000: "☀️",

1100: "🌤️",

1101: "⛅",

1102: "🌥️",

1001: "☁️",

2000: "🌫️",

2100: "🌫️",

4000: "🌧️",

4001: "🌧️",

4200: "🌧️",

4201: "🌧️",

5000: "🌨️",

8000: "⛈️"

};


return (
iconMap[code]
||
"🌤️"
);

}


/* =====================================================
8. 更新天氣膠囊
===================================================== */

function updateWeatherPill(
data
) {

const pillTempEl =
document.getElementById(
"pill-temp"
);


const logoContainer =
document.getElementById(
"pill-logo"
);


/*
* Tomorrow.io 溫度
*/

if (
data &&
data.tomorrow &&
data.tomorrow.temperature
!== undefined &&
data.tomorrow.temperature
!== null
) {

const temp =
Math.round(
data.tomorrow.temperature
);


pillTempEl.innerText =
`${temp}°`;

}


/*
* HKO Weather Icon
*/

if (
data &&
data.hko &&
data.hko.weatherIcon
) {

const iconCode =
data.hko.weatherIcon;


const imgUrl =
`https://www.hko.gov.hk/images/wxicon/pic${iconCode}.png`;


const img =
new Image();


img.src =
imgUrl;


img.onload =
function() {

logoContainer.innerHTML =
`<img src="${imgUrl}" alt="HKO Icon">`;

};


img.onerror =
function() {

if (
data.tomorrow &&
data.tomorrow.weatherCode
!== undefined
) {

logoContainer.innerText =
getWeatherIconByCode(
data.tomorrow.weatherCode
);

}

};

}
else if (
data &&
data.tomorrow &&
data.tomorrow.weatherCode
!== undefined
) {

logoContainer.innerText =
getWeatherIconByCode(
data.tomorrow.weatherCode
);

}

}


/* =====================================================
9. Worker 預報
===================================================== */

async function fetchForecast(
lat,
lon
) {

try {

debug(
"🌧️ 開始向 Worker 查詢 HKO + Tomorrow.io"
);


const response =
await fetch(

`${workerUrl}?lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}`

);


if (!response.ok) {

throw new Error(
"Worker HTTP " +
response.status
);

}


const data =
await response.json();


console.log(
"Worker API 回傳資料：",
data
);


debug(
"✅ Worker 已回傳資料"
);


/*
* 更新天氣膠囊
*/

updateWeatherPill(
data
);


/* =================================================
HKO
================================================= */

const alertDiv =
document.getElementById(
"rain-alert"
);


if (
data &&
data.hko
) {

if (
data.hko.immediateRain
>=
0.5
) {

alertDiv.innerText =
"⚠️ 你所在的位置將會有雨";


if (
rainStatus === 0
) {

speak(
"⚠️ 你所在的位置將會有雨"
);


rainStatus = 1;

}

}
else {

alertDiv.innerText =
"☁️ 你所在的位置暫時無雨";


rainStatus = 0;

}

}
else {

alertDiv.innerText =
"⚠️ HKO 資料暫時不可用";

}


/* =================================================
Tomorrow.io
================================================= */

if (
data &&
data.tomorrow
) {

if (
data.tomorrow.rainExpected
) {

document.getElementById(
"rainMsg"
).innerText =
data.tomorrow.message
||
"🌧 約六小時內可能有雨";

}
else {

document.getElementById(
"rainMsg"
).innerText =
"☀️ 未來六小時暫時無明顯降雨";

}

}
else {

document.getElementById(
"rainMsg"
).innerText =
"⚠️ AI 預報暫時不可用";

}

}
catch (err) {

console.error(
"Worker 預報錯誤:",
err
);


debug(
"❌ Worker 查詢失敗: " +
err.message
);


document.getElementById(
"rain-alert"
).innerText =
"⚠️ 系統繁忙，請稍後再試";


document.getElementById(
"rainMsg"
).innerText =
"⚠️ AI 預報暫時不可用";

}

}


/* =====================================================
10. 語音
===================================================== */

function speak(text) {

try {

const msg =
new SpeechSynthesisUtterance(
text
);


msg.lang =
"zh-HK";


speechSynthesis.speak(
msg
);

}
catch (err) {

console.warn(
"語音功能失敗:",
err
);

}

}


/* =====================================================
11. registerLocation
===================================================== */

async function registerLocation(
playerId,
lat,
lon
) {

try {

debug(
"📍 正在向 Worker 登記位置"
);


const res =
await fetch(

workerUrl +
"registerLocation",

{

method:
"POST",

headers: {

"Content-Type":
"application/json"

},

body:
JSON.stringify({

playerId:
playerId,

lat:
lat,

lon:
lon

})

}

);


if (!res.ok) {

throw new Error(
"registerLocation HTTP " +
res.status
);

}


const result =
await res.json();


console.log(
"registerLocation:",
result
);


if (
result.success
) {

debug(
"✅ 位置已登記到 Worker"
);

}
else {

debug(
"❌ Worker 登記位置失敗"
);

}

}
catch (err) {

console.error(
"registerLocation 失敗:",
err
);


debug(
"❌ registerLocation 失敗: " +
err.message
);

}

}


/* =====================================================
12. 取得 OneSignal Subscription ID
===================================================== */

async function getOneSignalPlayerId() {

try {

const OneSignal =
await window.oneSignalInitPromise;


if (!OneSignal) {

console.warn(
"⚠️ OneSignal 尚未可用"
);

return null;

}


const playerId =
OneSignal
.User
.PushSubscription
.id;


console.log(
"OneSignal Subscription ID:",
playerId
);


return playerId || null;

}
catch (err) {

console.error(
"取得 OneSignal Subscription ID 失敗:",
err
);


return null;

}


/* =====================================================
13. 等待 OneSignal Subscription
===================================================== */

async function waitForOneSignalSubscription(
OneSignal,
maxSeconds = 15
) {

for (
let i = 0;
i < maxSeconds;
i++
) {

const playerId =
OneSignal
.User
.PushSubscription
.id;


if (playerId) {

console.log(
"✅ OneSignal Subscription ID 已取得:",
playerId
);


return playerId;

}


await new Promise(
resolve =>
setTimeout(
resolve,
1000
)
);

}


console.warn(
"⚠️ 等待 OneSignal Subscription 超時"
);


return null;

}


/* =====================================================
14. 定位
===================================================== */

async function initLocation() {

return new Promise(
(resolve) => {

console.log(
"===== initLocation 開始 ====="
);


if (
!navigator.geolocation
) {

alert(
"此瀏覽器不支援定位功能"
);


const fallbackLat =
22.3;


const fallbackLon =
114.2;


map.setView(
[
fallbackLat,
fallbackLon
],
11
);


setMarker(
fallbackLat,
fallbackLon
);


fetchForecast(
fallbackLat,
fallbackLon
);


resolve();

return;

}


navigator.geolocation.getCurrentPosition(

async function(pos) {

console.log(
"===== 已進入 getCurrentPosition ====="
);


const lat =
pos.coords.latitude;


const lon =
pos.coords.longitude;


console.log(
"✅ 取得定位:",
lat,
lon
);


debug(
"📍 定位成功: " +
lat +
" , " +
lon
);


/* =========================================
第一部分：
立即取得 Worker 預報
========================================= */

map.setView(
[
lat,
lon
],
13
);


setMarker(
lat,
lon
);


fetchForecast(
lat,
lon
);


/* =========================================
第二部分：
檢查 OneSignal
========================================= */

console.log(
"===== 準備檢查 OneSignal ====="
);


const playerId =
await getOneSignalPlayerId();


if (playerId) {

console.log(
"✅ 已有 OneSignal Subscription"
);


debug(
"🔔 OneSignal 已訂閱"
);


await registerLocation(
playerId,
lat,
lon
);

}
else {

console.log(
"ℹ️ 目前沒有 OneSignal Subscription"
);


debug(
"🔔 尚未訂閱推播"
);

}


resolve();

},


function(err) {

console.warn(
"⚠️ 定位失敗，使用預設位置",
err
);


debug(
"⚠️ 定位失敗，使用預設位置"
);


const fallbackLat =
22.3;


const fallbackLon =
114.2;


map.setView(
[
fallbackLat,
fallbackLon
],
11
);


setMarker(
fallbackLat,
fallbackLon
);


fetchForecast(
fallbackLat,
fallbackLon
);


resolve();

},


{

enableHighAccuracy:
true,

timeout:
15000,

maximumAge:
300000

}

);

}

);

}


/* =====================================================
15. iOS Safari / PWA 判斷
===================================================== */

function isIOSDevice() {

return /iPhone|iPad|iPod/i
.test(
navigator.userAgent
);

}


function isStandalonePWA() {

return (
window.navigator.standalone === true
||
window.matchMedia(
"(display-mode: standalone)"
).matches
);

}


/* =====================================================
16. iOS 提示
===================================================== */

function showIosPromptOnce() {

if (!isIOSDevice()) {

return;

}


/*
* 如果已經是 PWA
* 不再顯示「加入主畫面」提示
*/

if (
isStandalonePWA()
) {

return;

}


if (
localStorage.getItem(
"iosPromptShown"
)
) {

return;

}


const prompt =
document.getElementById(
"iosPrompt"
);


if (!prompt) {

return;

}


prompt.style.display =
"block";


document.getElementById(
"iosCloseBtn"
).onclick =
function() {

prompt.style.display =
"none";


localStorage.setItem(
"iosPromptShown",
"1"
);

};

}


/* =====================================================
17. OneSignal 訂閱狀態檢查
===================================================== */

async function checkSubscriptionState() {

try {

const OneSignal =
await window.oneSignalInitPromise;


if (!OneSignal) {

return null;

}


const playerId =
OneSignal
.User
.PushSubscription
.id;


const permission =
OneSignal
.Notifications
.permission;


console.log(
"OneSignal permission:",
permission
);


console.log(
"OneSignal Subscription ID:",
playerId
);


if (playerId) {

debug(
"🔔 OneSignal Subscription ID 已存在"
);

}
else {

debug(
"🔔 OneSignal 尚未有 Subscription ID"
);

}


return playerId || null;

}
catch (err) {

console.error(
"檢查 OneSignal 訂閱狀態失敗:",
err
);


return null;

}


/* =====================================================
18. OneSignal 自訂訂閱提示
===================================================== */

async function showCustomPrompt() {

const prompt =
document.getElementById(
"customPrompt"
);


if (!prompt) {

return;

}


/*
* 如果已經有 Subscription ID，
* 不需要顯示訂閱提示
*/

const existingPlayerId =
await checkSubscriptionState();


if (existingPlayerId) {

prompt.style.display =
"none";

return;

}


/*
* iOS 非 PWA：
* 提示先加入主畫面
*/

if (
isIOSDevice()
&&
!isStandalonePWA()
) {

prompt.style.display =
"none";

return;

}


/*
* 顯示自訂訂閱提示
*/

prompt.style.display =
"block";


/* =================================================
訂閱按鈕
================================================= */

document.getElementById(
"subscribeBtn"
).onclick =
async function() {

const button =
document.getElementById(
"subscribeBtn"
);


try {

button.disabled =
true;


button.innerText =
"正在訂閱...";


const OneSignal =
await window.oneSignalInitPromise;


if (!OneSignal) {

throw new Error(
"OneSignal 尚未準備完成"
);

}


/*
* iOS PWA / Android / Chrome
*
* 要求通知權限
*/

console.log(
"===== 開始要求通知權限 ====="
);


await OneSignal
.Notifications
.requestPermission();


console.log(
"Notification Permission:",
OneSignal
.Notifications
.permission
);


/*
* 如果使用者拒絕
*/

if (
OneSignal
.Notifications
.permission
!==
true
) {

throw new Error(
"通知權限未獲得"
);

}


/*
* 明確要求 Push Subscription Opt In
*/

try {

await OneSignal
.User
.PushSubscription
.optIn();

console.log(
"✅ PushSubscription optIn 完成"
);

}
catch (optInError) {

console.warn(
"PushSubscription optIn:",
optInError
);

}


/*
* 等待 Subscription ID
*/

const playerId =
await waitForOneSignalSubscription(
OneSignal,
15
);


console.log(
"訂閱後 Player ID:",
playerId
);


if (!playerId) {

throw new Error(
"訂閱成功但尚未取得 Subscription ID"
);

}


/*
* 訂閱真正成功
*/

debug(
"🔔 OneSignal 訂閱成功"
);


/*
* 再取得定位
*/

if (
navigator.geolocation
) {

navigator.geolocation.getCurrentPosition(

async function(pos) {

const lat =
pos.coords.latitude;


const lon =
pos.coords.longitude;


await registerLocation(
playerId,
lat,
lon
);

},

function(err) {

console.warn(
"訂閱後取得定位失敗:",
err
);

}

);

}


/*
* 成功後才關閉提示
*/

prompt.style.display =
"none";


button.disabled =
false;


button.innerText =
"訂閱通知";

}
catch (err) {

console.error(
"❌ OneSignal 訂閱失敗:",
err
);


debug(
"❌ OneSignal 訂閱失敗: " +
err.message
);


alert(
"⚠️ 通知訂閱暫時未完成。\n\n" +
"請確認已允許通知權限，然後再試一次。"
);


button.disabled =
false;


button.innerText =
"重新訂閱";

}

};


/* =================================================
稍後再說
================================================= */

document.getElementById(
"closeCustomBtn"
).onclick =
function() {

prompt.style.display =
"none";

};

}


/* =====================================================
19. 頁面 Load
===================================================== */

window.addEventListener(
"load",
async function() {

debug(
"① load"
);


initMap();


debug(
"② map ok"
);


/*
* 先定位
*
* 不等待 OneSignal
*/

await initLocation();


debug(
"③ initLocation 完成"
);


/*
* iOS Safari 顯示加入主畫面提示
*/

showIosPromptOnce();


/*
* 等 OneSignal 自己完成初始化
*
* 然後再檢查是否已經訂閱
*/

setTimeout(
async function() {

await showCustomPrompt();

},
1500
);

});

</script>

</body>

</html>
